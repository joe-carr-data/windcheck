[project]
name = "windcheck"
version = "0.1.0"
description = "Cross-winding consistency checking and repair for Herculaneum scroll segmentations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.2",
    "tifffile>=2025.1.10",
    "zarr>=2.18,<3",
    "s3fs>=2025.9.0",
    "fsspec>=2025.9.0",
    "numcodecs>=0.12.1,<0.16",
    "scipy>=1.14",
    "imagecodecs>=2026.3.6",
]

[project.optional-dependencies]
# Upstream reader/writer for tifxyz + volume access. Kept optional so the core
# invariant check has no dependency on the project we are auditing.
vesuvius = ["vesuvius>=0.2.4"]
viz = ["matplotlib>=3.9"]

[project.scripts]
windcheck = "windcheck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windcheck"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
